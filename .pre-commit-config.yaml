# Verify gates run through `uv run` from the project env, so the hooks use
# the same uv-locked tool versions as `uv run pytest` — no pre-commit-managed
# environments to drift (language: system; requires uv on PATH, as everywhere
# else in this repo).
repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        files: '\.py$|^pyproject\.toml$'
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        files: '\.py$|^pyproject\.toml$'
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: '\.py$|^pyproject\.toml$'
