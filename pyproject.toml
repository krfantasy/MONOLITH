[project]
name = "monolith"
version = "0.1.0"
description = "MONOLITH - a brutalist extra-bold block font, plus its generator tooling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.64",
    "pillow>=11",
    "skia-pathops>=0.9.2",
    "uharfbuzz>=0.30",
]

[project.scripts]
monolith-specimen = "monolith.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty>=0.0.80",
]
glyphs = [
    "glyphs-cli>=0.2 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monolith"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
lint.select = ["E4", "E7", "E9", "F"]  # classic set; 0.16's expanded defaults flag deliberate Glyphs-compat shims (BLE001/S110/UP031/I001) ported 1:1 from the working script

[tool.ty.terminal]
error-on-warning = false  # warn = visible but non-gating; only errors fail

# fontTools' otTables and uharfbuzz assemble their members at runtime and ship
# no type stubs, so ty cannot resolve those attributes; warn instead of failing
# in the files that talk to those libraries. GlyphsApp/Glyphs exist only in
# Glyphs' embedded Python (build.py imports it, macro_bootstrap is exec'd there).
[[tool.ty.overrides]]
include = ["src/monolith/kern_axis.py", "src/monolith/specimen.py", "tests/test_shaping.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "warn"

[[tool.ty.overrides]]
include = ["src/monolith/build.py"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["GlyphsApp"]

[[tool.ty.overrides]]
include = ["scripts/macro_bootstrap.py"]

[tool.ty.overrides.rules]
unresolved-reference = "warn"
