[project]
name = "monolith"
version = "0.1.0"
description = "MONOLITH - a brutalist extra-bold block font, plus its generator tooling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.64",
    "pillow>=11",
]

[project.scripts]
monolith-specimen = "monolith.cli:main"
monolith-variable = "monolith.vfcli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monolith"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
lint.select = ["E4", "E7", "E9", "F"]  # classic set; 0.16's expanded defaults flag deliberate Glyphs-compat shims (BLE001/S110/UP031/I001) ported 1:1 from the working script
extend-exclude = ["glyph_gen.py", "render_specimen.py"]  # legacy pre-restructure scripts; deleted by the cleanup task, which also drops this line
